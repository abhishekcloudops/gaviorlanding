<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0066ff" rx="96"/>

  <!-- Gradient for modern look -->
  <defs>
    <linearGradient id="gGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0047b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gGradientAlt" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with gradient -->
  <rect width="512" height="512" fill="url(#gGradient)" rx="96"/>

  <!-- Letter G - Modern geometric style -->
  <g>
    <!-- Outer circle stroke -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gGradientAlt)" stroke-width="32" stroke-linecap="round"/>

    <!-- Inner G shape -->
    <path d="M 256 100 Q 360 100 380 190 L 340 210 Q 330 140 256 140 Q 160 140 160 256 Q 160 372 256 372 Q 340 372 360 310 L 360 220 L 260 220 L 280 180 L 400 180 L 400 280 Q 380 380 256 380 Q 140 380 140 256 Q 140 132 256 100 Z"
          fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Simplified modern G -->
    <g id="modernG">
      <!-- Left vertical stroke -->
      <line x1="150" y1="120" x2="150" y2="390" stroke="white" stroke-width="28" stroke-linecap="round"/>

      <!-- Top horizontal stroke -->
      <line x1="150" y1="120" x2="350" y2="120" stroke="white" stroke-width="28" stroke-linecap="round"/>

      <!-- Right vertical stroke -->
      <line x1="350" y1="120" x2="350" y2="256" stroke="white" stroke-width="28" stroke-linecap="round"/>

      <!-- Bottom right horizontal -->
      <line x1="250" y1="256" x2="350" y2="256" stroke="white" stroke-width="28" stroke-linecap="round"/>

      <!-- Bottom horizontal stroke -->
      <line x1="150" y1="390" x2="350" y2="390" stroke="white" stroke-width="28" stroke-linecap="round"/>
    </g>
  </g>
</svg>