name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gavior-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, gavior-production]
    environment: production
    steps:
      - name: Update and deploy application
        working-directory: /home/ubuntu/gavior
        run: |
          git pull --ff-only origin main
          if git diff --quiet HEAD@{1} HEAD -- package.json package-lock.json; then
            echo "Dependencies unchanged; reusing installed packages."
          else
            NODE_OPTIONS=--max-old-space-size=512 npm ci --no-audit --no-fund --maxsockets=1
          fi
          NODE_OPTIONS=--max-old-space-size=768 npm run build
          sudo systemctl restart gavior
          sudo systemctl is-active --quiet gavior
